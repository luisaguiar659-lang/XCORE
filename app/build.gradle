plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xcore.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xcore.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
