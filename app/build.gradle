plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystoreFile = System.getenv("XCORE_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("XCORE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("XCORE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("XCORE_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.xcore.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xcore.app'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '0.4.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'org.jsoup:jsoup:1.18.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
