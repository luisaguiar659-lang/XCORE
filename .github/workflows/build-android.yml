name: Build XCORE Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XCORE_HAS_SIGNING_KEY: ${{ secrets.XCORE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare persistent release signing
        if: env.XCORE_HAS_SIGNING_KEY == 'true'
        env:
          XCORE_KEYSTORE_BASE64: ${{ secrets.XCORE_KEYSTORE_BASE64 }}
        run: |
          echo "$XCORE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/xcore-release.jks"

      - name: Build update-ready APK
        if: env.XCORE_HAS_SIGNING_KEY == 'true'
        env:
          XCORE_KEYSTORE_FILE: ${{ github.workspace }}/xcore-release.jks
          XCORE_KEYSTORE_PASSWORD: ${{ secrets.XCORE_KEYSTORE_PASSWORD }}
          XCORE_KEY_ALIAS: ${{ secrets.XCORE_KEY_ALIAS }}
          XCORE_KEY_PASSWORD: ${{ secrets.XCORE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK (fallback)
        if: env.XCORE_HAS_SIGNING_KEY != 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload update-ready APK
        if: env.XCORE_HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XCORE-Android-Update
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        if: env.XCORE_HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XCORE-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
