name: Build XCORE Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build installer
        run: npm run build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XCORE-Windows
          path: release/*
